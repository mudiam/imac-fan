# /usr/lib/tmpfiles.d/imac-fan.conf
# The mode file holds one keyword (quiet|auto|max|off|fixed:N), group-writable
# by 'wheel' so the CLI and the Omarchy bar widget switch modes without root.
# The daemon re-asserts these perms on every start and sanitises the content.
# Only the daemon (root) ever writes to sysfs.
d /var/lib/imac-fan 0775 root wheel -
f /var/lib/imac-fan/mode 0664 root wheel - auto
