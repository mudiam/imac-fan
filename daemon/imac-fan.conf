# /etc/imac-fan/config — settings for imac-fan(8)
#
# After editing:  sudo systemctl restart imac-fan
# Check it took:  imac-fan status   /   journalctl -u imac-fan -f

# Which applesmc fan to control. On the mid-2011 27" iMac:
#   fan1 = "ODD"   fan2 = "HDD"   fan3 = "CPU"
# The HDD fan is the one that roars when an SSD replaced the Apple drive.
FAN=2

# "quiet" mode: fixed RPM to hold. 1100 is this fan's firmware minimum.
QUIET_RPM=1100

# "auto" mode: temperature -> RPM curve, as "degC:RPM" points in ascending
# order. The regulating temperature is the hotter of the CPU package and the
# GPU diode (SMC sensor TG0D). Linear interpolation runs between points;
# below the first point it holds the first RPM, above the last it holds the last.
CURVE=55:1100 68:1900 78:3200 85:4800

# Seconds between re-applying the target (the SMC can otherwise reclaim the fan).
INTERVAL=5

# Always jump to maximum RPM at or above this temperature, in any mode.
CRITICAL_TEMP=92

# On daemon stop, hand the fan back to the firmware (1) or leave it at the last
# manual value (0). Leaving it (0) keeps things quiet if the service is
# restarting, but means a crashed daemon won't ramp this fan — the CPU fan,
# still firmware-controlled, handles system thermals regardless.
RESTORE_ON_EXIT=1

# Mode used before the CLI/widget has ever set one: quiet | auto | max | off
DEFAULT_MODE=auto
